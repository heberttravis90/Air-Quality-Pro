<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Quality Pro Update</title><style>body{font-family:system-ui;background:#07131b;color:#eaf7fa;padding:28px}button{padding:14px 18px;border:0;border-radius:12px;background:#25d0b1;font-weight:800}p{color:#9ab1ba}</style><h2>Air Quality Pro v1.1 update</h2><p>This clears old Air Quality Pro service workers and cached shells, then opens the current app.</p><button id="go">Clear old cache & open app</button><script>go.onclick=async()=>{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())if(k.startsWith('air-quality-pro-'))await caches.delete(k)}location.href='./index.html?v=11&t='+Date.now()}</script>
