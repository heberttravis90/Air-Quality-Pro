<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Air Quality Pro — Cache Reset</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06131a;color:#e8f7f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px}.card{width:min(520px,100%);background:#0b2029;border:1px solid #24505c;border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}h1{font-size:24px;margin:0 0 10px}p{color:#a9c2c8;line-height:1.5}.ok{color:#5be6d1;font-weight:800}.bad{color:#ffb4b4;font-weight:800}button{width:100%;min-height:48px;border-radius:12px;border:1px solid #40e0c2;background:linear-gradient(180deg,#26ceb0,#19aa91);color:#03120f;font-weight:900;font-size:15px;margin-top:12px}</style>
</head>
<body><main class="card"><h1>Air Quality Pro Cache Reset</h1><p id="status">Clearing the old app cache…</p><button id="open" hidden>Open Air Quality Pro</button></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const btn=document.getElementById('open');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.innerHTML='<span class="ok">Old cache cleared.</span> Tap below to load the current build.';
    btn.hidden=false;
    btn.onclick=()=>location.replace('./index.html?fresh='+Date.now());
  }catch(e){
    status.innerHTML='<span class="bad">Automatic reset failed.</span> Clear site data for this GitHub Pages site in Chrome, then reopen it.';
    btn.hidden=false;
    btn.textContent='Try opening current build';
    btn.onclick=()=>location.replace('./index.html?fresh='+Date.now());
  }
})();
</script></body></html>
